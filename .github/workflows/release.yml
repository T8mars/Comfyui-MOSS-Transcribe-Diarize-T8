name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt transformers==5.16.1 Pillow pytest comfy-cli==1.19.0 ruff==0.16.5
      - name: Test against pinned ComfyUI V3 API
        run: |
          git clone --filter=blob:none https://github.com/Comfy-Org/ComfyUI.git .compat/ComfyUI
          git -C .compat/ComfyUI checkout 5ab2f7a2d676c1fb7b410c22e82e2ed8f217b56c
          PYTHONPATH="$PWD/.compat/ComfyUI" python -m pytest -q tests
      - name: Validate source and Registry metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/verify_pinned_revisions.py
          comfy node validate
          ruff check .
      - name: Build twice and compare
        run: |
          python scripts/build_release.py --output "${RUNNER_TEMP}/release-a" --expected-tag "${GITHUB_REF_NAME}"
          python scripts/build_release.py --output "${RUNNER_TEMP}/release-b" --expected-tag "${GITHUB_REF_NAME}"
          diff -rq "${RUNNER_TEMP}/release-a" "${RUNNER_TEMP}/release-b"
          mkdir dist
          cp "${RUNNER_TEMP}/release-a/"* dist/
          sha256sum dist/*
      - name: Upload validated release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Attest and publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download validated release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "comfyui-MOSS-Transcribe-Diarize-T8 ${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "comfyui-MOSS-Transcribe-Diarize-T8 ${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  publish-registry:
    name: Publish tagged version to Comfy Registry
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Registry publisher
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate Registry token configuration
        if: ${{ env.REGISTRY_ACCESS_TOKEN == '' }}
        run: echo "::warning::REGISTRY_ACCESS_TOKEN is not configured; Registry publication was skipped."
      - name: Install pinned Registry publisher
        if: ${{ env.REGISTRY_ACCESS_TOKEN != '' }}
        run: python -m pip install comfy-cli==1.19.0
      - name: Publish custom node
        if: ${{ env.REGISTRY_ACCESS_TOKEN != '' }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
