name: Publish to Comfy Registry

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release tag to republish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Registry publisher
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate requested published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_ref must be a version tag such as v0.3.7."
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_REF}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "::error::Checked-out HEAD does not match tag ${RELEASE_REF}."
            exit 1
          fi
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$RELEASE_REF" != "v${package_version}" ]]; then
            echo "::error::Tag ${RELEASE_REF} does not match pyproject version v${package_version}."
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_REF" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_REF} is missing or still a draft."
            exit 1
          fi
      - name: Validate Registry token configuration
        if: ${{ env.REGISTRY_ACCESS_TOKEN == '' }}
        run: |
          echo "::error::REGISTRY_ACCESS_TOKEN is not configured; Registry publication cannot continue."
          exit 1
      - name: Install pinned Registry publisher
        run: python -m pip install comfy-cli==1.16.0
      - name: Publish custom node
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
