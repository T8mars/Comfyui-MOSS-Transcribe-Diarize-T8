name: Publish to Comfy Registry

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag or branch to publish (for retries)
        required: true
        default: main

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
      - name: Validate Registry token configuration
        if: ${{ env.REGISTRY_ACCESS_TOKEN == '' }}
        run: echo "::warning::REGISTRY_ACCESS_TOKEN is not configured; Registry publication was skipped."
      - name: Publish custom node
        if: ${{ env.REGISTRY_ACCESS_TOKEN != '' }}
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
