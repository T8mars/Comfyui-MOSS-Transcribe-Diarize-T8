name: validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday 04:15 Asia/Shanghai (GitHub cron uses UTC).
    - cron: "15 20 * * 0"

permissions:
  contents: read

jobs:
  compatibility:
    name: Windows / Python ${{ matrix.python }} / Transformers ${{ matrix.transformers }}
    if: ${{ github.event_name != 'schedule' }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            transformers: "5.5.0"
          - python: "3.12"
            transformers: "5.6.0"
          - python: "3.12"
            transformers: "5.15.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install validation dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt transformers==${{ matrix.transformers }} Pillow pytest
      - name: Test against pinned ComfyUI V3 API
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/Comfy-Org/ComfyUI.git .compat/ComfyUI
          git -C .compat/ComfyUI checkout 5ab2f7a2d676c1fb7b410c22e82e2ed8f217b56c
          $env:PYTHONPATH = (Resolve-Path .compat/ComfyUI).Path
          python -m pytest -q tests
      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q .

  latest-comfyui:
    name: Ubuntu / latest ComfyUI API
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt transformers==5.15.1 Pillow pytest
      - name: Test against latest ComfyUI V3 API
        run: |
          git clone --depth=1 https://github.com/Comfy-Org/ComfyUI.git .compat/ComfyUI
          comfyui_sha="$(git -C .compat/ComfyUI rev-parse HEAD)"
          echo "Testing ComfyUI commit ${comfyui_sha}"
          echo "### Latest ComfyUI compatibility" >> "$GITHUB_STEP_SUMMARY"
          echo "Tested commit: \`${comfyui_sha}\`" >> "$GITHUB_STEP_SUMMARY"
          PYTHONPATH="$PWD/.compat/ComfyUI" python -m pytest -q tests

  package-metadata:
    name: Registry metadata, security, and source quality
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package tooling
        run: python -m pip install comfy-cli==1.16.0 ruff==0.12.12
      - name: Validate Comfy Registry metadata and security
        run: comfy node validate
      - name: Lint Python sources
        run: ruff check .
      - name: Validate JSON assets
        run: |
          python -m json.tool locales/en/nodeDefs.json >/dev/null
          python -m json.tool locales/zh/nodeDefs.json >/dev/null
          for file in example_workflows/api/*.json example_workflows/ui/*.json manifests/*.json; do python -m json.tool "$file" >/dev/null; done
      - name: Verify pinned upstream revisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_pinned_revisions.py
      - name: Verify deterministic release build
        run: |
          python scripts/build_release.py --output "${RUNNER_TEMP}/release-a"
          python scripts/build_release.py --output "${RUNNER_TEMP}/release-b"
          diff -rq "${RUNNER_TEMP}/release-a" "${RUNNER_TEMP}/release-b"
