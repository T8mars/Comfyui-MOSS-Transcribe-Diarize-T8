name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt transformers==5.6.0 Pillow pytest comfy-cli==1.16.0
      - name: Check against pinned ComfyUI API
        shell: pwsh
        run: |
          git clone https://github.com/Comfy-Org/ComfyUI.git .compat/ComfyUI
          git -C .compat/ComfyUI checkout 5ab2f7a2d676c1fb7b410c22e82e2ed8f217b56c
          $env:PYTHONPATH = (Resolve-Path .compat/ComfyUI).Path
          python -m pytest -q tests
      - name: Validate Comfy Registry metadata and security
        shell: pwsh
        run: comfy node validate
      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q .
